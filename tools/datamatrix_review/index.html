<html lang="ru">

<style>
:root{color-scheme:dark;--bg:#10151b;--panel:#19212a;--line:#303e4b;--muted:#a6b4c3;--ink:#edf4fb;--cyan:#5edeea;--orange:#ffb35e;--red:#ff777e;--green:#83deb2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit;background:#202c38;border:1px solid var(--line);border-radius:7px;padding:7px 10px}button,a,select{cursor:pointer}button:hover{border-color:var(--cyan)}a{color:var(--cyan)}button:disabled{opacity:.4;cursor:default}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;line-height:1.25;margin:4px 0 0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 8px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 98px)}aside{padding:18px 12px;border-right:1px solid var(--line);height:calc(100vh - 98px);overflow:auto;position:sticky;top:0}aside select,aside input{width:100%;margin-bottom:9px}.case{width:100%;text-align:left;display:block;padding:10px 12px;margin:7px 0;background:transparent;position:relative}.case.active{background:#243744;border-color:var(--cyan)}.case b{display:block;font-weight:600}.case small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.pill{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap}.bad{color:var(--red)}.good{color:var(--green)}main{padding:22px;max-width:1650px;min-width:0}.summary{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}.stat{padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;flex:1;min-width:135px}.stat strong{font-size:22px;margin-right:6px}.stat span{font-size:12px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.heading h2{font-size:24px}.timing{display:flex;gap:8px;flex-wrap:wrap}.explain{background:var(--panel);border-left:3px solid var(--cyan);padding:13px 17px;margin-bottom:16px;border-radius:0 8px 8px 0}.explain p{margin:5px 0}.explain .warning{color:var(--muted);font-size:12px;margin-top:9px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.panelhead{padding:13px 14px;border-bottom:1px solid var(--line);min-height:115px}.panelhead h3{display:flex;justify-content:space-between;align-items:center}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.row select{min-width:0;max-width:100%}.row label{font-size:12px;white-space:nowrap}.row input[type=checkbox]{accent-color:var(--cyan);vertical-align:middle}.row .grow{flex:1}.canvas{height:500px;background:#090e13;position:relative;overflow:hidden}.canvas svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.canvas svg:active{cursor:grabbing}.canvas .empty{padding:30px;position:absolute;top:40%;text-align:center;width:100%;color:var(--muted)}.tools{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.caption{padding:11px 14px;min-height:90px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;margin-top:7px}.dot{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.box{padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.box p{margin:7px 0}.stages{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.stage{font-size:11px;background:#22313d;padding:4px 8px;border-radius:5px}.stage.done{color:var(--green)}.tablewrap{max-height:210px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}.small{font-size:12px}footer{padding:20px 0;color:var(--muted);font-size:11px}.loader{padding:70px;color:var(--muted)}#error{color:var(--red);padding:20px}.notes{white-space:pre-line}details{margin-top:10px}summary{cursor:pointer;color:var(--muted)}code{font-size:12px;background:#101820;padding:2px 5px;border-radius:4px}.noresult{padding:20px;color:var(--muted)}
@media(min-width:1500px){.canvas{height:590px}}@media(max-width:1100px){.shell{grid-template-columns:200px minmax(0,1fr)}main{padding:14px}.workspace,.details{grid-template-columns:1fr}.canvas{height:500px}}@media(max-width:650px){header{padding:15px;align-items:start}header .muted{display:none}.shell{display:block}aside{height:auto;max-height:230px;position:static;border-right:0;border-bottom:1px solid var(--line)}#cases{display:flex;gap:5px;overflow:auto}.case{min-width:145px}.heading{align-items:start;flex-direction:column}.canvas{height:410px}.summary .stat{min-width:100px}h1{font-size:18px}}
</style>
<header><div><div class="eyebrow">CSQR-D / Data Matrix</div><h1>Почему код не прочитан</h1></div><div class="muted small">Реальные гипотезы сканера · ECC200<br><a href="README.md">Таблица случаев</a> &nbsp; <a href="manifest.json">Происхождение данных</a></div></header>
<div class="shell"><aside><select id="status" aria-label="Фильтр результатов"><option value="all">Все 19 кадров</option><option value="failed">15 не прочитаны</option><option value="rescued">4 читает thorough</option></select><input id="search" placeholder="Найти dm0032…" aria-label="Поиск по имени"><div id="cases"></div></aside><main id="main"><div class="loader">Загрузка подборки…</div></main></div>
<script src="summary.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={clock_gate:'Проверка сплошной L-рамки',candidate:'Кандидат после перспективы',boundaries:'Кривые внешних границ',straightened:'Выпрямленный фрагмент',field_lines:'Интегральные линии и узлы',read_points:'Точки считывания модулей',flow_iteration:'Сетка после уточнения',flow_vectors:'Векторы оптического потока',flow_reference:'Опорное изображение потока',decode:'Считанная битовая матрица',hard_grid_count:'Бинаризация без допустимой сетки'};
const help={clock_gate:'Две линии показывают реальные позиции проверки сплошных сторон. left и bottom — число чёрных пикселей из 216; требуется не меньше 150 на каждой. Отказ здесь блокирует дорогое восстановление повреждённых тактовых дорожек для этой ориентации.',candidate:'Фрагмент 256×256 из исходного фото. Ранг и score относятся к геометрическому кандидату, а не к вероятности правильного распознавания.',boundaries:'Цветные линии — полиномы, которыми алгоритм аппроксимировал четыре внешние стороны. Уход линии внутрь кода или захват текста рядом могут объяснить дальнейшую ошибку.',straightened:'Результат преобразования по четырём аппроксимированным границам. Проверьте, стали ли строки и столбцы прямыми и одинаково ли распределены модули.',field_lines:'Голубые линии — трассированные столбцы, оранжевые — строки. Красные узлы — их вычисленные пересечения. Линии должны сохранять соответствие одним и тем же строкам и столбцам модулей, а узлы попадать в центры ячеек.',read_points:'Это реальные исходные точки конкретного вызова считывания. Декодер также пробует малые смещения ±0,15 шага. В геометрии с ошибкой часть точек попадает в соседние модули.',flow_iteration:'Изображение перед очередной попыткой декодирования после итеративных поправок потоком. Нулевая итерация — до оптического потока.',flow_vectors:'Отрезки показывают локальные поправки потока у центров модулей. Компоненты ограничиваются ±9 px. Это поправки в координатах увеличенного фрагмента, не исходного фото.',flow_reference:'Предварительный рисунок построен из текущего фрагмента; только внешний служебный рисунок задан структурой Data Matrix. Правильный текст заранее не используется.',decode:'Битовая матрица, действительно переданная ECC200-декодеру. Показан результат проверки и смещение считывания. Checksum не доказывает, что исходная печать неисправна.',hard_grid_count:'На этой бинаризации простое считывание тактовых дорожек не дало допустимого размера ECC200. Это локальный отказ одной ориентации/бинаризации, а не всего сканера.'};
let data=null, activeName='', selectedPass=0, selectedKind='field_lines', selectedView=0, loadingName='', cache={}, zooms={};
function fillCases(){
 const term=$('#search').value.toLowerCase(), status=$('#status').value;
 const cases=REVIEW.cases.filter(c=>c.name.includes(term)&&(status==='all'||(status==='rescued')===c.thorough.decoded));
 $('#cases').innerHTML=cases.map(c=>`<button class="case ${c.name===activeName?'active':''}" data-name="${esc(c.name)}"><b>${esc(c.name)}</b><small class="${c.thorough.decoded?'good':'bad'}">${c.thorough.decoded?'Читает расширенный':'Не прочитан'}</small><small>fast ${c.fast.median_ms.toFixed(0)} · thorough ${c.thorough.median_ms.toFixed(0)} мс</small></button>`).join('')||'<div class="noresult">Нет кадров</div>';
 document.querySelectorAll('.case').forEach(b=>b.onclick=()=>loadCase(b.dataset.name));
}
function loadCase(name){
 activeName=name;loadingName=name;location.hash=name.replace('.jpg','');fillCases();
 if(cache[name])return showCase(cache[name]);
 $('#main').innerHTML='<div class="loader">Загрузка трассы '+esc(name)+'…</div>';
 const script=document.createElement('script');script.src='cases/'+name.replace('.jpg','')+'/data.js';
 script.onerror=()=>{$('#main').innerHTML='<div id="error">Не удалось загрузить данные кадра. Пересоздайте отчёт командой из документации.</div>'};document.body.append(script);
}
window.reviewCase=c=>{cache[c.name]=c;if(c.name===loadingName)showCase(c)};
function passOptions(){return data.passes.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join('')}
function showCase(c){
 data=c;selectedPass=c.passes[0]?.id||0;selectedKind=c.views.some(v=>v.kind==='field_lines')?'field_lines':'candidate';selectedView=0;
 const n=c.notes||{}, rescue=c.thorough.decoded;
 $('#main').innerHTML=`<div class="summary"><div class="stat"><strong>19</strong><span>отказов fast</span></div><div class="stat"><strong class="bad">15</strong><span>не прочитаны</span></div><div class="stat"><strong class="good">4</strong><span>восстановлены thorough</span></div><div class="stat"><strong>${c.raw_events.toLocaleString('ru')}</strong><span>событий в этом кадре</span></div></div>
 <div class="heading"><div><h2>${esc(c.name)}</h2><span class="muted small">${c.width} × ${c.height} · <a href="${esc(c.original)}" target="_blank">Оригинал в полном размере ↗</a></span></div><div class="timing"><span class="pill bad">fast: отказ · ${c.fast.median_ms.toFixed(1)} мс</span><span class="pill ${rescue?'good':'bad'}">thorough: ${rescue?'успех':'отказ'} · ${c.thorough.median_ms.toFixed(1)} мс</span></div></div>
 <div class="explain"><b>${esc(c.stage)}</b><p>${esc(c.observed)}</p>${n.observation?'<p><b>На изображении:</b> '+esc(n.observation)+'</p>':''}${n.hypothesis?'<p><b>Рабочая гипотеза:</b> '+esc(n.hypothesis)+'</p>':''}${n.next?'<p><b>Что сравнить:</b> '+esc(n.next)+'</p>':''}<p class="warning">${esc(c.warning)}</p></div>
 <div class="workspace"><section class="panel"><div class="panelhead"><h3>Исходник и локализация <a class="small" href="${esc(c.original)}" target="_blank">Открыть ↗</a></h3><div class="row"><select id="pass" class="grow" aria-label="Проход">${passOptions()}</select></div><div class="row"><label><input id="boxes" type="checkbox" checked> Выбранные рамки</label><label><input id="allboxes" type="checkbox"> Все контуры</label><label><input id="gray" type="checkbox"> Изображение детектора</label></div></div><div class="canvas" id="originalCanvas"></div><div class="tools"><span>Колесо — масштаб · перетаскивание — панорама</span><span><button id="zoomBoxes">К выбранным рамкам</button> <button id="resetOriginal">Сброс</button></span></div><div class="caption" id="originalCaption"></div></section>
 <section class="panel"><div class="panelhead"><h3>Геометрия и декодирование ${rescue?'<button id="successView" class="small">Успешная ветка</button>':''}</h3><div class="row"><select id="kind" class="grow" aria-label="Этап"></select><label><input id="samepass" type="checkbox"> Этот проход</label></div><div class="row"><button id="prev" aria-label="Предыдущая гипотеза">←</button><select id="view" class="grow" aria-label="Гипотеза"></select><button id="next" aria-label="Следующая гипотеза">→</button><label><input id="lines" type="checkbox" checked> Линии</label><label><input id="nodes" type="checkbox" checked> Узлы</label><label><input id="pattern" type="checkbox"> L / clock</label></div></div><div class="canvas" id="detailCanvas"></div><div class="tools"><span id="viewCount"></span><button id="resetDetail">Сброс</button></div><div class="caption" id="detailCaption"></div></section></div>
 <div class="details"><section class="box"><h3>Что проверил алгоритм</h3><div id="stages" class="stages"></div><div id="facts"></div><p class="muted small">Количество попыток — перебор гипотез и смещений, не число разных кодов на фото.</p><details><summary>Размеры сеток в восстановлении</summary><div class="tablewrap"><table><thead><tr><th>Сетка</th><th>Гипотез</th></tr></thead><tbody>${c.dimensions.map(x=>`<tr><td>${x.w} × ${x.h}</td><td>${x.attempts}</td></tr>`).join('')}</tbody></table></div></details></section><section class="box"><h3>Как читать наложения</h3><p><span style="color:var(--cyan)">Голубые</span> — столбцы / выбранные рамки; <span style="color:var(--orange)">оранжевые</span> — строки; <span style="color:var(--red)">красные точки</span> — центры считывания.</p><p class="muted small">Рамки, L-стороны и сетки — гипотезы сканера, а не ручная разметка правильного положения. Наложения сняты с реального исполнения, не нарисованы по ожидаемому тексту.</p><p class="small">${c.shown_views} визуализаций из ${c.raw_events} событий. Полный перебор сохранён в <a href="${esc(c.raw)}">events.jsonl.gz</a>.</p><p class="muted small">Время на карточке — медиана трёх повторов сохранённого бенчмарка. Запись PNG и трассы существенно замедляет диагностику и не входит в эти цифры.</p>${rescue?'<details><summary>Декодированный текст HRI</summary><p><code>'+esc(c.thorough.text)+'</code></p></details>':''}<details><summary>Ошибки ZXing</summary><pre class="small">${esc(JSON.stringify(c.error_messages,null,2))}</pre></details></section></div>
 <footer>Трасса текущего сканера; статусы и тексты сверены с контрольными отчётами. Независимой текстовой разметки датасета нет. Интерфейс показывает ограниченную подборку гипотез; полные события сохранены отдельно. SHA-256 исходника: ${esc(c.source_sha256)}</footer>`;
 $('#pass').value=selectedPass;$('#pass').onchange=()=>{selectedPass=+$('#pass').value;renderOriginal();updateViews()};
 ['boxes','allboxes','gray'].forEach(k=>$('#'+k).onchange=renderOriginal);
 const kinds=[...new Set(c.views.map(v=>v.kind))];$('#kind').innerHTML=kinds.map(k=>`<option value="${k}">${labels[k]||k}</option>`).join('');$('#kind').value=selectedKind;
 $('#kind').onchange=()=>{selectedKind=$('#kind').value;selectedView=0;updateViews()};$('#samepass').onchange=()=>{selectedView=0;updateViews()};
 $('#view').onchange=()=>{selectedView=+$('#view').value;renderDetail()};
 $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
 ['lines','nodes','pattern'].forEach(k=>$('#'+k).onchange=renderDetail);
 $('#zoomBoxes').onclick=()=>{const p=data.passes.find(p=>p.id===selectedPass),pts=p.boxes.filter(b=>b.selected).flatMap(b=>b.points);if(!pts.length)return;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y,m=Math.max(w,h)*.15;zooms.original.fit([x-m,y-m,w+2*m,h+2*m])};$('#resetOriginal').onclick=()=>renderOriginal();$('#resetDetail').onclick=()=>renderDetail();
 if($('#successView'))$('#successView').onclick=()=>{const v=data.views.find(v=>v.valid&&v.kind==='flow_iteration')||data.views.find(v=>v.valid&&v.kind==='field_lines')||data.views.find(v=>v.valid&&v.kind==='read_points');if(!v)return;$('#samepass').checked=false;selectedKind=v.kind;$('#kind').value=v.kind;selectedView=data.views.filter(x=>x.kind===v.kind).findIndex(x=>x.id===v.id);if(v.pass){selectedPass=v.pass;$('#pass').value=v.pass;renderOriginal()}updateViews()};
 const counts=c.counts, st=[['candidate','Кандидат'],['straightened','Границы'],['read_points','Сетка'],['field_lines','Линии'],['flow_iteration','Поток']];
 $('#stages').innerHTML=st.map(([k,l])=>`<span class="stage ${counts[k]?'done':''}">${counts[k]?'✓':'–'} ${l}</span>`).join('');
 $('#facts').innerHTML=`<table><tr><td>Проходов локализации</td><td>${c.passes.length}</td></tr><tr><td>Выбрано геометрических кандидатов</td><td>${counts.candidate||0}</td></tr><tr><td>Выпрямлений / отказов подгонки</td><td>${counts.straightened||0} / ${counts.boundary_rejected||0}</td></tr><tr><td>Вызовов считывания по узлам</td><td>${counts.read_points||0}</td></tr><tr><td>Проверок ECC200, включая равномерные сетки</td><td>${(counts.decode||0)+(counts.uniform_decode||0)}</td></tr><tr><td>Ошибок Checksum / Format</td><td>${c.errors['2']||0} / ${c.errors['1']||0}</td></tr></table>`;
 renderOriginal();updateViews();if(rescue)$('#successView').click();
}
function svgBase(image,w,h){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img"><image href="${esc(image)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" style="image-rendering:${w<145?'pixelated':'auto'}"/>`}
function poly(points,color,width=1,closed=false){return `<path d="${points.filter(p=>p[0]!=null&&p[1]!=null).map((p,i)=>(i?'L':'M')+p.join(',')).join(' ')}${closed?' Z':''}" fill="none" stroke="${color}" stroke-width="${width}" opacity=".9"/>`}
function renderOriginal(){
 const p=data.passes.find(p=>p.id===selectedPass);if(!p)return;
 let s=svgBase($('#gray').checked?p.image:data.original,p.width,p.height);
 for(const b of p.boxes){if(!($('#allboxes').checked||($('#boxes').checked&&b.selected)))continue;
 s+=poly(b.points,b.selected?'#5edeea':b.texture?'#ffb35e':'#9c9ca5',b.selected?2.5:0.6,true);
 if(b.selected){const x=b.points.reduce((a,t)=>a+t[0],0)/4,y=b.points.reduce((a,t)=>a+t[1],0)/4;
 s+=`<text x="${x}" y="${y}" fill="#5edeea" stroke="#081017" stroke-width="3" paint-order="stroke" font-size="16" text-anchor="middle">C${b.id}</text>`}}
 $('#originalCanvas').innerHTML=s+'</svg>';zooms.original=panZoom($('#originalCanvas svg'),p.width,p.height);
 const ranks=p.ranks.filter(r=>r.kind==='fine_rank'&&r.retained);
 $('#originalCaption').innerHTML=`<b>${esc(p.label)}</b> · ${p.boxes.length} контуров, ${p.boxes.filter(b=>b.texture).length} прошли текстурный фильтр, ${p.selected.length} выбраны для восстановления.<br>`+ranks.map(r=>`C${r.candidate}: ранг ${r.rank}, score ${r.score.toFixed(3)}`).join(' · ')+`<div class="legend"><span><i class="dot" style="background:var(--cyan)"></i>Выбранные</span><span><i class="dot" style="background:var(--orange)"></i>Текстура прошла, кандидат не выбран</span><span>Серый — текстура отклонена</span></div>`;
}
function filtered(){return data.views.filter(v=>v.kind===selectedKind&&(!$('#samepass').checked||v.pass===selectedPass))}
function viewLabel(v){const n=v.numbers;return `#${v.id}${v.valid?' ✓':''}${n.w?' · '+n.w+'×'+n.h:''}${n.rank?' · ранг '+n.rank:''}${n.kernel!=null?' · окно '+n.kernel:''}${n.iteration!=null?' · ит. '+n.iteration:''}${n.quality!=null?' · q='+n.quality.toFixed(3):''}${v.pass?' · '+(data.passes.find(p=>p.id===v.pass)?.label||''):''}`}
function updateViews(){const vs=filtered();selectedView=Math.min(selectedView,Math.max(0,vs.length-1));$('#view').innerHTML=vs.map((v,i)=>`<option value="${i}">${esc(viewLabel(v))}</option>`).join('');$('#view').value=selectedView;renderDetail()}
function move(d){selectedView=Math.max(0,Math.min(filtered().length-1,selectedView+d));$('#view').value=selectedView;renderDetail()}
function renderDetail(){
 const vs=filtered(),v=vs[selectedView];$('#prev').disabled=selectedView<=0;$('#next').disabled=selectedView>=vs.length-1;$('#viewCount').textContent=vs.length?`${selectedView+1} / ${vs.length} · событие #${v.id}`:'Нет гипотез этого этапа';
 if(!v){$('#detailCanvas').innerHTML='<div class="empty">В этом проходе нет сохранённых гипотез выбранного этапа.<br>Снимите фильтр «Этот проход» или выберите другой этап.</div>';$('#detailCaption').textContent='';return}
 let s=svgBase(v.image,v.width,v.height);
 if($('#lines').checked)v.lines.forEach((l,i)=>s+=poly(l,v.kind==='field_lines'?(i<(v.numbers.w||0)?'#5edeea':'#ffb35e'):['#5edeea','#ffb35e','#83deb2','#c7a7ff'][i%4],v.kind==='flow_vectors'?0.9:0.7));
 if($('#nodes').checked){const r=v.kind==='decode'?0.05:Math.max(.8,v.width/512);s+=v.points.filter(p=>p[0]!=null&&p[1]!=null).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="#ff515d" opacity=".85"/>`).join('')}
 if($('#pattern').checked&&v.width===256&&['read_points','field_lines'].includes(v.kind)){s+=poly([[16,16],[16,239],[239,239]],'#83deb2',2);s+=`<path d="M16 16H239V239" fill="none" stroke="#fff175" stroke-width="2" stroke-dasharray="4 4"/>`}
 $('#detailCanvas').innerHTML=s+'</svg>';panZoom($('#detailCanvas svg'),v.width,v.height);
 const facts=Object.entries(v.numbers).map(([k,x])=>`${k}: ${typeof x==='number'?Number.isInteger(x)?x:x.toFixed(4):x}`).join(' · ');
 $('#detailCaption').innerHTML=`<b>${esc(labels[v.kind])}</b>${v.valid?' <span class="good">· ветка успешного декодирования</span>':''}<br>${esc(help[v.kind]||'')}<br><span style="color:var(--ink)">${esc(facts)}</span>${v.strings.message?'<br>ZXing: '+esc(v.strings.message):''}${v.kind==='decode'?'<br><b class="'+(v.numbers.valid?'good':'bad')+'">'+(v.numbers.valid?'Decoded':({1:'Format',2:'Checksum',3:'Unsupported'}[v.numbers.error]||'Не декодирован'))+'</b>':''}<br><a href="${esc(v.image)}" target="_blank">Фрагмент без наложений ↗</a>`;
}
function panZoom(svg,w,h){let box=[0,0,w,h],drag=null;function apply(){svg.setAttribute('viewBox',box.join(' '))}svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),scale=e.deltaY>0?1.15:1/1.15,nw=Math.max(w/16,Math.min(w*2,box[2]*scale)),nh=nw*h/w,fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;box=[box[0]+(box[2]-nw)*fx,box[1]+(box[3]-nh)*fy,nw,nh];apply()},{passive:false});svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,box:[...box]};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();box=[drag.box[0]-(e.clientX-drag.x)*box[2]/r.width,drag.box[1]-(e.clientY-drag.y)*box[3]/r.height,box[2],box[3]];apply()};svg.onpointerup=svg.onpointercancel=()=>drag=null;return {fit:bounds=>{box=[...bounds];apply()}};}
$('#status').onchange=fillCases;$('#search').oninput=fillCases;
if(typeof REVIEW==='undefined'){$('#main').innerHTML='<div id="error">Нет summary.js. Сначала запустите test/datamatrix_review.py.</div>'}else{fillCases();let initial=location.hash.slice(1)+'.jpg';if(!REVIEW.cases.some(c=>c.name===initial))initial=REVIEW.cases[0]?.name;if(initial)loadCase(initial)}
</script>
</html>
